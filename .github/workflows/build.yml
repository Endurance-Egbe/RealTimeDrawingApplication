name: Build and test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: NuGet/setup-nuget@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Restore legacy NuGet packages
        run: nuget restore RealTimeDrawingApplication.sln
      - name: Restore locked test dependencies
        run: dotnet restore tests/RealTimeDrawingApplication.Tests/RealTimeDrawingApplication.Tests.csproj --locked-mode
      - name: Lint changed files
        shell: pwsh
        run: git diff --check
      - name: Build WPF application
        run: msbuild RealTimeDrawingApplication.sln /p:Configuration=Release /p:Platform="Any CPU"
      - name: Package Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path bin\Release\* -DestinationPath artifacts\RealTimeDrawingApplication-windows.zip
      - name: Test
        run: >-
          dotnet test tests/RealTimeDrawingApplication.Tests/RealTimeDrawingApplication.Tests.csproj
          --configuration Release
          --no-restore
          --settings tests/RealTimeDrawingApplication.Tests/coverage.runsettings
          --collect:"XPlat Code Coverage"
      - name: Enforce 40 percent line coverage
        shell: pwsh
        run: |
          $coverageFile = Get-ChildItem `
            -Path "tests\RealTimeDrawingApplication.Tests\TestResults" `
            -Filter coverage.cobertura.xml -Recurse |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $coverageFile) {
            throw "Coverage report was not generated."
          }
          [xml]$coverage = Get-Content $coverageFile.FullName
          $lineRate = [double]$coverage.coverage.'line-rate'
          $percentage = [math]::Round($lineRate * 100, 2)
          Write-Host "Measured line coverage: $percentage%"
          if ($lineRate -lt 0.40) {
            throw "Line coverage $percentage% is below the required 40% threshold."
          }
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tests/RealTimeDrawingApplication.Tests/TestResults/**/coverage.cobertura.xml
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: RealTimeDrawingApplication-windows
          path: artifacts/RealTimeDrawingApplication-windows.zip
