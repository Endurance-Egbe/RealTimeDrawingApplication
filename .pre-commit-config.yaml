repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-xml
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: dotnet-build
        name: Build WPF application
        entry: dotnet build RealTimeDrawingApplication.sln --no-restore
        language: system
        pass_filenames: false
        files: '\.(cs|xaml|csproj|config)$'
